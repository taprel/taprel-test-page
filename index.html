<!doctype html>
<!--
  Test page: plays the role of a customer's web app.
  Open this file in a browser while the Taprel agent is running (npm run tauri dev).
  It talks to the agent with protocol v0 (docs/ARCHITECTURE.md).
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Taprel test page</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2em auto; padding: 0 1em; }
    button, select { font-size: 1em; padding: 0.4em 0.8em; margin: 0.2em 0; }
    input[type="number"] { width: 4em; font-size: 1em; }
    #status { font-weight: bold; }
    #log { background: #111; color: #ddd; padding: 0.8em; font-size: 0.8em; height: 260px; overflow: auto; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Taprel test page</h1>
  <p>Agent: <span id="status">not connected</span> <button id="connect">Connect</button></p>
  <p>
    <select id="printers"></select>
    <button id="refresh" disabled>Refresh printers</button>
  </p>
  <p><button id="print" disabled>Print test receipt (ESC/POS)</button></p>
  <p>
    Label <input id="labelWidth" type="number" value="40" /> x
    <input id="labelHeight" type="number" value="30" /> mm
    <button id="printTspl" disabled>Print label (TSPL)</button>
    <button id="printZpl" disabled>Print label (ZPL)</button>
  </p>
  <p>
    PDF (any printer, through its driver): <input id="pdfFile" type="file" accept="application/pdf" />
    <button id="printPdf" disabled>Print PDF</button>
  </p>
  <p>
    PDF options: copies <input id="pdfCopies" type="number" value="1" min="1" />
    scale <select id="pdfScale"><option value="fit">fit</option><option value="actual">actual size</option></select>
    <label><input id="pdfPaper" type="checkbox" /> paper = label size above</label>
  </p>
  <h3>Document (JSON, see docs/DOCUMENT-FORMAT.md)</h3>
  <p>
    <textarea id="document" rows="22" style="width: 100%; font-family: monospace"></textarea>
  </p>
  <p>
    <button id="previewDocument" disabled>Preview</button>
    <button id="printDocument" disabled>Print on the selected printer</button>
    <button id="printDocumentKind" disabled>Print with printerKind</button>
    <button id="sampleReceipt">Sample receipt</button>
    <button id="sampleLabel">Sample label</button>
  </p>
  <p><img id="documentPreview" alt="" style="border: 1px solid #ccc; max-width: 100%" hidden /></p>
  <h3>Messages</h3>
  <div id="log"></div>

  <script>
    const AGENT_URL = "ws://127.0.0.1:21873";
    const $ = (id) => document.getElementById(id);

    let ws = null;
    let nextId = 1;
    const pending = new Map(); // request id -> resolve function

    function setButtons(enabled) {
      for (const id of ["refresh", "print", "printTspl", "printZpl", "printPdf", "previewDocument", "printDocument", "printDocumentKind"]) $(id).disabled = !enabled;
    }

    function log(line) {
      $("log").textContent += line + "\n";
      $("log").scrollTop = $("log").scrollHeight;
    }

    // Sends a request and returns a promise for the reply with the same id.
    function request(type, fields = {}) {
      const id = String(nextId++);
      const msg = { id, type, ...fields };
      const shown = msg.data ? { ...msg, data: `<${msg.data.length} base64 chars>` } : msg;
      log("-> " + JSON.stringify(shown));
      ws.send(JSON.stringify(msg));
      return new Promise((resolve) => pending.set(id, resolve));
    }

    function connect() {
      ws = new WebSocket(AGENT_URL);
      $("status").textContent = "connecting...";
      ws.onopen = async () => {
        $("status").textContent = "connected";
        setButtons(true);
        const hello = await request("hello", { client: { name: "test-page", version: "0.0.1" } });
        if (hello.ok) $("status").textContent = `connected (agent ${hello.result.agentVersion})`;
        await refreshPrinters();
      };
      ws.onmessage = (event) => {
        // Previews are long: show only the start of them.
        log("<- " + (event.data.length > 500 ? event.data.slice(0, 500) + "..." : event.data));
        const reply = JSON.parse(event.data);
        pending.get(reply.id)?.(reply);
        pending.delete(reply.id);
      };
      ws.onclose = () => {
        $("status").textContent = "not connected (is the agent running?)";
        setButtons(false);
      };
    }

    async function refreshPrinters() {
      const reply = await request("printers.list");
      if (!reply.ok) return;
      const select = $("printers");
      select.innerHTML = "";
      for (const p of reply.result.printers) {
        const option = new Option(p.name + (p.isDefault ? " (default)" : ""), p.name);
        // Pre-select the receipt printer for convenience.
        if (p.name.includes("XP-80")) option.selected = true;
        select.add(option);
      }
    }

    // Builds an ESC/POS receipt as bytes. Later the SDK's receipt builder does this.
    function buildReceipt() {
      const ESC = 0x1b, GS = 0x1d;
      const bytes = [];
      const cmd = (...b) => bytes.push(...b);
      const text = (s) => bytes.push(...new TextEncoder().encode(s));

      cmd(ESC, 0x40);              // reset
      cmd(ESC, 0x61, 1);           // center
      cmd(GS, 0x21, 0x11);         // double size
      text("TEST SHOP\n");
      cmd(GS, 0x21, 0x00);         // normal size
      text("Printed from a web page\n");
      text(new Date().toLocaleString() + "\n\n");
      cmd(ESC, 0x61, 0);           // left align
      text("1 x Coffee            3.00\n");
      text("2 x Croissant         5.00\n");
      text("--------------------------------\n");
      cmd(ESC, 0x45, 1);           // bold on
      text("TOTAL                 8.00\n");
      cmd(ESC, 0x45, 0);           // bold off
      cmd(ESC, 0x61, 1);           // center
      text("\nThank you!\n");
      cmd(GS, 0x56, 0x42, 3);      // feed and cut
      return new Uint8Array(bytes);
    }

    // Label printers: 203 dpi = 8 dots per mm. Positions below are in dots.
    // Same adaptive layout as the agent's test label (printers/test_pages.rs):
    // the barcode gets shorter and thinner on small labels (min 15 x 12 mm).
    function labelLayout() {
      const w = Number($("labelWidth").value), h = Number($("labelHeight").value);
      const wd = w * 8, hd = h * 8;
      const barHeight = Math.min(60, Math.max(0, hd - 40 - 32));
      // "12345678" in Code 128 (digits packed in pairs) is 79 bar units wide.
      const barModule = 12 * 2 + 79 * 2 <= wd ? 2 : 1;
      return { w, h, wd, hd, barHeight, barModule };
    }

    // TSPL (TSC, Xprinter, ...): one text command per line.
    function buildTsplLabel() {
      const { w, h, wd, hd, barHeight, barModule: m } = labelLayout();
      const lines = [
        `SIZE ${w} mm,${h} mm`,
        "GAP 2 mm,0 mm",
        "DIRECTION 1",
        "CLS",
        `BOX 4,4,${wd - 4},${hd - 4},2`,
        'TEXT 12,12,"2",0,1,1,"Web TSPL"',
        `BARCODE 12,40,"128",${barHeight},1,0,${m},${m},"12345678"`,
        "PRINT 1,1",
      ];
      return new TextEncoder().encode(lines.map((l) => l + "\r\n").join(""));
    }

    // ZPL (Zebra and compatibles): ^XA ... ^XZ.
    function buildZplLabel() {
      const { wd, hd, barHeight, barModule } = labelLayout();
      const zpl = [
        "^XA",
        `^PW${wd}`,
        `^LL${hd}`,
        `^FO4,4^GB${wd - 8},${hd - 8},2^FS`,
        "^FO12,12^A0N,20,20^FDWeb ZPL^FS",
        `^FO12,40^BY${barModule}^BCN,${barHeight},Y,N,N,A^FD12345678^FS`,
        "^XZ",
      ].join("\n");
      return new TextEncoder().encode(zpl);
    }

    // Bytes -> base64 text, so they fit in a JSON message.
    function toBase64(bytes) {
      let binary = "";
      for (const b of bytes) binary += String.fromCharCode(b);
      return btoa(binary);
    }

    $("connect").onclick = connect;
    $("refresh").onclick = refreshPrinters;
    const printBytes = (bytes) =>
      request("print.raw", { printer: $("printers").value, data: toBase64(bytes) });
    $("print").onclick = () => printBytes(buildReceipt());
    $("printTspl").onclick = () => printBytes(buildTsplLabel());
    $("printZpl").onclick = () => printBytes(buildZplLabel());
    // PDF: read the chosen file's bytes and send them with print.pdf.
    $("printPdf").onclick = async () => {
      const file = $("pdfFile").files[0];
      if (!file) return log("Choose a PDF file first");
      const bytes = new Uint8Array(await file.arrayBuffer());
      const options = { copies: Number($("pdfCopies").value), scale: $("pdfScale").value };
      if ($("pdfPaper").checked) {
        options.paper = { widthMm: Number($("labelWidth").value), heightMm: Number($("labelHeight").value) };
      }
      request("print.pdf", { printer: $("printers").value, data: toBase64(bytes), options });
    };

    // Documents: JSON the agent turns into what the printer understands.
    const SAMPLE_LABEL = {
      version: 1,
      type: "label",
      size: { width: 40, height: 30 },
      content: [
        { box: true, x: 0.5, y: 0.5, width: 39, height: 29, thickness: 0.3 },
        { text: "Café bio 500 g", x: 2, y: 2, width: 36, height: 3, bold: true },
        { text: "12.90 €", x: 2, y: 7, width: 22, height: 4 },
        { text: "قهوة", x: 25, y: 7, width: 13, height: 3, align: "end" },
        { barcode: "3760123456784", format: "ean13", x: 2, y: 13, width: 24, height: 14, showText: true },
        { qr: "https://example.com/p/42", x: 28, y: 15, size: 10 },
      ],
    };
    const SAMPLE_RECEIPT = {
      version: 1,
      type: "receipt",
      content: [
        { text: "Café Central", align: "center", bold: true, size: 2 },
        { text: "12 rue de la Paix", align: "center" },
        { text: "مقهى السلام", align: "center", bold: true, size: 2 },
        { line: true },
        { row: ["2 x Coffee", "6.00"] },
        { row: ["1 x Croissant", "2.50"] },
        { row: ["قهوة", "6.00"] },
        { line: "dashed" },
        { row: ["Total", "14.50"], bold: true, size: 2 },
        { line: "double" },
        { text: "Thank you", align: "center" },
        { qr: "https://example.com/order/42", size: 25, align: "center" },
        { barcode: "123456789012", format: "code128", height: 12, showText: true, align: "center" },
        { cut: true },
      ],
    };
    $("document").value = JSON.stringify(SAMPLE_RECEIPT, null, 2);
    $("sampleReceipt").onclick = () => ($("document").value = JSON.stringify(SAMPLE_RECEIPT, null, 2));
    $("sampleLabel").onclick = () => ($("document").value = JSON.stringify(SAMPLE_LABEL, null, 2));

    function readDocument() {
      try {
        return JSON.parse($("document").value);
      } catch (e) {
        log("The JSON is not valid: " + e.message);
        return null;
      }
    }
    $("previewDocument").onclick = async () => {
      const document_ = readDocument();
      if (!document_) return;
      const reply = await request("document.preview", { printer: $("printers").value, document: document_ });
      if (!reply.ok) return;
      $("documentPreview").src = "data:image/png;base64," + reply.result.png;
      $("documentPreview").hidden = false;
    };
    $("printDocument").onclick = () => {
      const document_ = readDocument();
      if (document_) request("print.document", { printer: $("printers").value, document: document_ });
    };
    $("printDocumentKind").onclick = () => {
      const document_ = readDocument();
      if (document_) request("print.document", { printerKind: document_.type, document: document_ });
    };

    connect();
  </script>
</body>
</html>
